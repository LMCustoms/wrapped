[package]
name = "wrapped"
version = "0.1.0"
description = "Wrapped — Native macOS email client"
authors = []
license = ""
repository = ""
default-run = "wrapped"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
